<h3>Products Sale</h3>

<form method="post" action="/sale">
    <div class="form-group">
        <label class="form-label">Product Name</label>
        <input class="form-input" type="text" name="product" required>
    </div>

    <div class="form-group">
        <label class="form-label">Unit Price</label>
        <input class="form-input" type="number" step="0.01" min="0" name="price" required>
    </div>

    <div class="form-group">
        <label class="form-label">Number of Pieces</label>
        <input class="form-input" type="number" min="1" name="quantity" required>
    </div>

    <button class="btn btn-success">Submit</button>
</form>
