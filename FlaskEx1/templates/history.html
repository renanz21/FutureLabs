<h3>Operation History</h3>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>#</th>
            <th>Operation</th>
            <th>Description</th>
            <th>Value</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in history %}
        <tr>
            <td>{{loop.index}}</td>
            <td>{{entry.type}}</td>
            <td>{{entry.description}}</td>
            <td>{{entry.value}}</td>
        </tr>
        {%endfor%}
    </tbody>
</table>
